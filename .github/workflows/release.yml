name: 打包发布

on:
  push:
    tags: ['v*']
  # 手动触发：用来试打包，不会发布。产物在 Actions 运行页的 Artifacts 里下载。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: macOS 安装包（arm64 + x64）
    # macOS 构建只能在 macOS 上跑 —— electron-builder 在其他平台会直接报
    # "Build for macOS is supported only on macOS"。所以这里必须用 macOS runner。
    # 架构由 --arm64 / --x64 显式指定，与 runner 自身架构无关（当前 macos-latest 是 arm64）。
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 与 ci.yml 一致：--ignore-scripts 跳过 electron 的二进制下载，
      # electron-builder 打包时会自己按目标平台下载对应的一份。
      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 打包
        run: npm run dist -- --mac --arm64 --x64 --publish onTag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 没有 Apple 开发者证书，别让 electron-builder 去找签名身份。
          # package.json 里已配 mac.identity = null，这里是双保险。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: jianji-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
