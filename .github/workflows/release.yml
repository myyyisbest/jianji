name: 打包发布

on:
  push:
    tags: ['v*']
  # 手动触发：试打包，不发 Release；产物在 Actions Artifacts 里下载。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows 安装包（x64）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --ignore-scripts 跳过 electron 预下载；electron-builder 打包时再按目标平台拉。
      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 打包
        run: npm run dist:win -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: jianji-windows
          path: |
            dist/*.exe
          if-no-files-found: error

  build-mac:
    name: macOS 安装包（arm64 + x64）
    # macOS 构建只能在 macOS 上跑 —— electron-builder 在其他平台会直接报
    # "Build for macOS is supported only on macOS"。所以这里必须用 macOS runner。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 打包
        run: npm run dist:mac -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 没有 Apple 开发者证书，别让 electron-builder 去找签名身份。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: jianji-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  build-linux:
    name: Linux 安装包（x64）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 打包
        run: npm run dist:linux -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: jianji-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    name: 挂到 GitHub Release
    needs: [build-windows, build-mac, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 发布 / 更新 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
